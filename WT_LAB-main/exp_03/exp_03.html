<!DOCTYPE html> 
<html > 
<head> 
    <title>CSS Demonstration</title> 
    <!-- Linking External CSS --> 
    <link rel="stylesheet" href="styles.css"> 
    <!-- Internal CSS --> 
    <style> 
        h1 { 
            color: green; 
            text-align: center; 
        } 
        .internal { 
            font-size: 18px; 
            color: blue; 
        } 
    </style> 
</head> 
<body> 
    <!-- Inline CSS --> 
    <h1 style="font-family: Arial, sans-serif;">Welcome to CSS Demonstration</h1> 
    <p class="internal">This paragraph is styled using internal CSS</p> 
    <p class="external">This paragraph is styled using external CSS</p> 
    <p style="color: red; font-weight: bold;">This paragraph is styled using inline CSS.</p> 
</body> 
</html> 
Style.css 
.external { 
    font-size: 20px; 
    color: purple; 
    font-style: italic; 
}
