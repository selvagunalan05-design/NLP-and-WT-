<!DOCTYPE html> 
<html> 
<head> 
    <title>Simple Array Sorting</title> 
</head> 
<body> 
    <h1>Simple Array Sorting</h1> 
    <label>Enter numbers (comma separated):</label> 
    <input type="text" id="numbers" placeholder="e.g., 4,2,7,1,5"> 
    <button onclick="performSort()">Sort Array</button> 
    <h3>Sorted Array:</h3> 
    <p id="output"></p> 
    <script> 
        function sortArray(arr) { 
            for (let i = 0; i < arr.length - 1; i++) { 
                for (let j = 0; j < arr.length - 1 - i; j++) { 
                    if (arr[j] > arr[j + 1]) { 
     let temp = arr[j]; 
                        arr[j] = arr[j + 1]; 
                        arr[j + 1] = temp; 
                    } 
                } 
            } 
            return arr; 
        } 
        function performSort() { 
            let input = document.getElementById("numbers").value; 
            let array = input.split(',').map(Number);  
            let sortedArray = sortArray(array); 
            document.getElementById("output").innerText = sortedArray.join(", "); 
        } 
    </script> 
</body> 
</html>
